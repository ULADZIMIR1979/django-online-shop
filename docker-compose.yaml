version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "gunicorn mysite.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --workers 2 --preload"
    ports:
      - "127.0.0.1:8000:8000"
    restart: always
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "200k"
    volumes:
      - ./mysite/database/:/app/database/
