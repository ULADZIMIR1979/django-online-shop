{% extends 'blogapp/base.html' %}

{% block title %}Создание статьи - Блог{% endblock %}

{% block content %}
<div class="create-header" style="border-bottom: 2px solid #28a745; padding-bottom: 25px; margin-bottom: 30px;">
    <h1 style="color: #2c3e50; margin-bottom: 15px;">Создание новой статьи</h1>
</div>

<form method="post" style="max-width: 800px;">
    {% csrf_token %}
    
    <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Заголовок:</label>
        {{ form.title }}
    </div>
    
    <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Содержание:</label>
        {{ form.content }}
    </div>
    
    <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Категория:</label>
        {{ form.category }}
    </div>
    
    <div style="margin-bottom: 30px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Теги:</label>
        {{ form.tags }}
        <small style="color: #666;">Удерживайте Ctrl для выбора нескольких тегов</small>
    </div>
    
    <div style="display: flex; gap: 15px;">
        <button type="submit" style="background: #28a745; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em;">
            📝 Создать статью
        </button>
        <a href="{% url 'blogapp:article_list' %}" style="background: #6c757d; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; font-size: 1.1em;">
            ❌ Отмена
        </a>
    </div>
</form>
{% endblock %}
