<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Блог{% endblock %}</title>
    <style>
        /* ... ваш существующий CSS ... */
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="site-title">
                <a href="{% url 'blogapp:article_list' %}">📝 Мой Блог</a>
            </h1>
            <p class="site-description">Площадка для обмена знаниями и опытом</p>
        </div>
    </header>

    <div class="container">
        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>

        {% block extra_content %}
        {% endblock %}

        {% block back_link %}
        {% endblock %}
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Мой Блог. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
