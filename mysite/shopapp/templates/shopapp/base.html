<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %}
            MyShop
        {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'shopapp:index' %}">🏪 MyShop</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'shopapp:products_list' %}">Products</a>
                <a class="nav-link" href="{% url 'shopapp:order_list' %}">Orders</a>
                {% if user.is_staff %}
                <a class="nav-link" href="{% url 'shopapp:orders_export' %}">Export</a>
                {% endif %}
            </div>
            <div class="navbar-text text-light">
                {% if user.is_authenticated %}
                    Welcome, {{ user.username }}
                {% else %}
                    <a href="/admin/login/" class="text-light">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block body %}
        {% endblock %}
    </div>

    <footer class="bg-dark text-light py-3 mt-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <p class="mb-0">&copy; 2025 MyShop</p>
                </div>
                <div class="col-auto">
                    <small class="me-3">{% now "Y-m-d H:i" %}</small>
                    <a href="/admin/" class="text-light">Admin</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
